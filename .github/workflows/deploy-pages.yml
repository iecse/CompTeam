name: Refresh Ratings and Deploy

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'tsconfig*.json'
      - '.oxlintrc.json'
      - '.stylelintrc.json'
      - '.htmlhintrc'
      - '.github/workflows/**'
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Lint source
        if: github.event_name == 'push'
        shell: pwsh
        run: npm run lint

      - name: Lint CSS
        if: github.event_name == 'push'
        shell: pwsh
        run: npm run lint:css

      - name: Lint HTML
        if: github.event_name == 'push'
        shell: pwsh
        run: npm run lint:html

      - name: Test rating providers
        if: github.event_name == 'push'
        shell: pwsh
        run: npm run test:ratings

      - name: Validate data schemas
        shell: pwsh
        run: npm run validate:data

      - name: Check deprecated dependencies
        shell: pwsh
        run: npm run check:deprecated

      - name: Security audit
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Fetch updated ratings
        shell: pwsh
        run: npm run fetch:ratings

      - name: Build static site
        shell: pwsh
        run: npm run build

      - name: Prepare branch-published site
        shell: pwsh
        run: npm run sync:pages-root

      - name: Verify branch-published site
        shell: pwsh
        run: npm run check:pages-root

      - name: Commit updated ratings and published site
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -A -- src/data/ratings.json index.html assets favicon.png icons.svg .nojekyll
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Ratings and published site are unchanged.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw 'Could not inspect published changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh ratings and published site [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit published changes.' }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push published changes.' }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        shell: pwsh
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-deployed-site.mjs "$env:PAGES_URL"
